<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои желания</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    max-width: 600px;
    margin: 0 auto;
    padding: 20px 16px 80px;
    background: linear-gradient(160deg, #fdf6f0 0%, #f3e8ff 100%);
    min-height: 100vh;
    color: #2d2d2d;
  }
  h1 { font-size: 26px; margin-bottom: 4px; }
  .sub { color: #888; font-size: 14px; margin-bottom: 20px; }
  .form {
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: white;
    padding: 16px;
    border-radius: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    margin-bottom: 24px;
  }
  input, select {
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #e0d8e8;
    font-size: 15px;
    font-family: inherit;
    background: #fafafa;
    width: 100%;
  }
  input:focus, select:focus { outline: none; border-color: #a78bca; background: white; }
  button {
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: #8b6bb1;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:active { opacity: 0.8; }
  button:disabled { opacity: 0.5; }
  .wish {
    background: white;
    padding: 16px;
    border-radius: 14px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  .wish.done { opacity: 0.45; }
  .wish.done .wish-text { text-decoration: line-through; }
  .wish-text { font-size: 16px; margin-bottom: 4px; word-break: break-word; }
  .wish-meta { font-size: 12px; color: #999; }
  .wish-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .icon-btn {
    background: none;
    border: none;
    font-size: 18px;
    padding: 4px 6px;
    cursor: pointer;
    color: #999;
    width: auto;
  }
  .empty { text-align: center; color: #aaa; padding: 40px 0; font-size: 15px; }
  .auth-box {
    background: white;
    padding: 24px;
    border-radius: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.06);
  }
  .auth-box p { color: #666; font-size: 14px; margin-bottom: 16px; text-align: center; }
  .auth-box input { margin-bottom: 10px; }
  .auth-box button { width: 100%; }
  .logout {
    background: none;
    color: #999;
    font-size: 13px;
    padding: 6px 0;
    text-decoration: underline;
    width: auto;
  }
  .hidden { display: none !important; }
  .info { font-size: 13px; color: #c66; text-align: center; margin-top: 12px; min-height: 18px; }
</style>
</head>
<body>

  <div id="auth-screen">
    <h1>✨ Мои желания</h1>
    <div class="sub">Войди, чтобы открыть свою карту</div>
    <div class="auth-box">
      <p>Введи email и пароль</p>
      <input id="email" type="email" placeholder="email" autocomplete="username" />
      <input id="password" type="password" placeholder="пароль" autocomplete="current-password" />
      <button id="login-btn" onclick="login()">Войти</button>
      <div id="auth-msg" class="info"></div>
    </div>
  </div>

  <div id="app-screen" class="hidden">
    <h1>✨ Мои желания</h1>
    <div class="sub">Карта того, к чему я иду</div>

    <div class="form">
      <input id="text" placeholder="Что я хочу?" />
      <select id="importance">
        <option value="1">🔥 Очень важно</option>
        <option value="2">⭐ Важно</option>
        <option value="3">💭 Просто хочется</option>
      </select>
      <button onclick="add()">Добавить желание</button>
    </div>

    <div id="list"></div>

    <div style="text-align:center; margin-top:24px;">
      <button class="logout" onclick="logout()">Выйти</button>
    </div>
  </div>

<script>
  const SUPABASE_URL = 'https://mdlpxazhddmkjzqvyjpp.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_0umpiGCYpJdrK2xru-IrBw_sdzbW3nC';

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let wishes = [];
  let currentUser = null;

  async function checkSession() {
    const { data } = await db.auth.getSession();
    if (data.session) {
      currentUser = data.session.user;
      showApp();
    } else {
      showAuth();
    }
  }

  function showAuth() {
    document.getElementById('auth-screen').classList.remove('hidden');
    document.getElementById('app-screen').classList.add('hidden');
  }

  function showApp() {
    document.getElementById('auth-screen').classList.add('hidden');
    document.getElementById('app-screen').classList.remove('hidden');
    loadWishes();
  }

  async function login() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const msg = document.getElementById('auth-msg');

    if (!email || !password) {
      msg.textContent = 'Введи email и пароль';
      return;
    }

    document.getElementById('login-btn').disabled = true;
    msg.textContent = '';

    const { data, error } = await db.auth.signInWithPassword({
      email: email,
      password: password
    });

    document.getElementById('login-btn').disabled = false;

    if (error) {
      msg.textContent = 'Ошибка: неверный email или пароль';
      return;
    }

    currentUser = data.user;
    document.getElementById('password').value = '';
    showApp();
  }

  async function logout() {
    await db.auth.signOut();
    currentUser = null;
    wishes = [];
    showAuth();
  }

  async function loadWishes() {
    const list = document.getElementById('list');
    list.innerHTML = '<div class="empty">Загружаю...</div>';

    const { data, error } = await db
      .from('wishes')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      list.innerHTML = '<div class="empty">Ошибка: ' + error.message + '</div>';
      return;
    }
    wishes = data || [];
    render();
  }

  function render() {
    const list = document.getElementById('list');
    if (wishes.length === 0) {
      list.innerHTML = '<div class="empty">Пока пусто. Добавь первое желание ✨</div>';
      return;
    }
    const sorted = [...wishes].sort((a, b) => {
      if (a.done !== b.done) return a.done ? 1 : -1;
      return a.importance - b.importance;
    });
    const stars = { 1: '🔥 Очень важно', 2: '⭐ Важно', 3: '💭 Хочется' };
    list.innerHTML = sorted.map(w => `
      <div class="wish ${w.done ? 'done' : ''}">
        <div>
          <div class="wish-text">${escapeHtml(w.text)}</div>
          <div class="wish-meta">${stars[w.importance] || ''}</div>
        </div>
        <div class="wish-actions">
          <button class="icon-btn" onclick="toggle(${w.id})">${w.done ? '↩' : '✓'}</button>
          <button class="icon-btn" onclick="remove(${w.id})">✕</button>
        </div>
      </div>
    `).join('');
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function add() {
    const text = document.getElementById('text').value.trim();
    if (!text) return;

    const importance = +document.getElementById('importance').value;

    const { data, error } = await db
      .from('wishes')
      .insert([{
        text: text,
        importance: importance,
        user_id: currentUser.id
      }])
      .select();

    if (error) {
      alert('Ошибка: ' + error.message);
      return;
    }

    document.getElementById('text').value = '';
    wishes.unshift(data[0]);
    render();
  }

  async function toggle(id) {
    const w = wishes.find(x => x.id === id);
    if (!w) return;

    const { error } = await db
      .from('wishes')
      .update({ done: !w.done })
      .eq('id', id);

    if (error) { alert('Ошибка: ' + error.message); return; }
    w.done = !w.done;
    render();
  }

  async function remove(id) {
    if (!confirm('Удалить это желание?')) return;

    const { error } = await db
      .from('wishes')
      .delete()
      .eq('id', id);

    if (error) { alert('Ошибка: ' + error.message); return; }
    wishes = wishes.filter(x => x.id !== id);
    render();
  }

  document.getElementById('text').addEventListener('keypress', e => {
    if (e.key === 'Enter') add();
  });
  document.getElementById('password').addEventListener('keypress', e => {
    if (e.key === 'Enter') login();
  });

  db.auth.onAuthStateChange((event, session) => {
    if (session) {
      currentUser = session.user;
      showApp();
    } else {
      currentUser = null;
      showAuth();
    }
  });

  checkSession();
</script>
</body>
</html>
