<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Мои желания — доска</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: -apple-system, system-ui, sans-serif;
    background: #14141a;
    color: #eee;
    touch-action: none;
  }

  /* ===== Масштаб интерфейса ===== */
  :root {
    --ui-scale: 1;
    --card-min-w: 140px;
    --card-min-h: 100px;
    --topbar-padding: 10px 12px;
    --btn-padding: 8px 12px;
    --btn-font: 13px;
    --title-font: 16px;
    --modal-max-w: 420px;
    --modal-padding: 22px;
    --modal-label: 13px;
    --modal-input: 14px;
    --modal-h2: 18px;
    --modal-btn-font: 14px;
    --modal-btn-padding: 12px;
    --zone-label: 13px;
    --hint-font: 13px;
    --rem-font: 14px;
    --rem-icon: 24px;
  }

  /* Планшет / небольшой ноутбук */
  @media (min-width: 768px) {
    :root {
      --ui-scale: 1.4;
      --card-min-w: 220px;
      --card-min-h: 160px;
      --topbar-padding: 16px 24px;
      --btn-padding: 12px 20px;
      --btn-font: 18px;
      --title-font: 24px;
      --modal-max-w: 580px;
      --modal-padding: 32px;
      --modal-label: 17px;
      --modal-input: 18px;
      --modal-h2: 26px;
      --modal-btn-font: 18px;
      --modal-btn-padding: 16px;
      --zone-label: 16px;
      --hint-font: 17px;
      --rem-font: 19px;
      --rem-icon: 30px;
    }
  }

  /* Твой монитор 2560×1440, 27" */
  @media (min-width: 1400px) {
    :root {
      --ui-scale: 1.8;
      --card-min-w: 280px;
      --card-min-h: 200px;
      --topbar-padding: 20px 32px;
      --btn-padding: 16px 26px;
      --btn-font: 23px;
      --title-font: 30px;
      --modal-max-w: 720px;
      --modal-padding: 40px;
      --modal-label: 21px;
      --modal-input: 23px;
      --modal-h2: 32px;
      --modal-btn-font: 23px;
      --modal-btn-padding: 20px;
      --zone-label: 20px;
      --hint-font: 21px;
      --rem-font: 24px;
      --rem-icon: 38px;
    }
  }

  /* Огромный монитор */
  @media (min-width: 2200px) {
    :root {
      --ui-scale: 2.1;
      --btn-font: 26px;
      --title-font: 34px;
      --modal-h2: 36px;
      --modal-input: 26px;
      --modal-label: 24px;
      --modal-btn-font: 26px;
      --zone-label: 23px;
    }
  }

  /* ===== Экран входа ===== */
  #auth-screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px;
    background: linear-gradient(160deg, #1a1a22 0%, #25203a 100%);
    z-index: 100;
  }
  #auth-screen h1 { font-size: calc(28px * var(--ui-scale)); margin-bottom: 6px; color: #fff; }
  #auth-screen .sub { color: #888; font-size: calc(15px * var(--ui-scale)); margin-bottom: 28px; }
  .auth-box {
    background: #252530; padding: calc(28px * var(--ui-scale)); border-radius: 18px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    width: 100%; max-width: calc(420px * var(--ui-scale));
  }
  .auth-box p { color: #aaa; font-size: calc(15px * var(--ui-scale)); margin-bottom: 18px; text-align: center; }
  .auth-box input {
    width: 100%; padding: calc(14px * var(--ui-scale)); margin-bottom: 12px;
    border-radius: 12px; border: 1px solid #3a3a45;
    font-size: calc(16px * var(--ui-scale)); font-family: inherit; background: #1a1a22; color: #eee;
  }
  .auth-box input:focus { outline: none; border-color: #a78bca; }
  .auth-box button {
    width: 100%; padding: calc(14px * var(--ui-scale)); border-radius: 12px; border: none;
    background: #7a5ba0; color: white; font-size: calc(16px * var(--ui-scale));
    font-weight: 600; cursor: pointer;
  }
  .auth-box button:disabled { opacity: 0.5; }
  .auth-msg { font-size: calc(14px * var(--ui-scale)); color: #e88; text-align: center; margin-top: 14px; min-height: 20px; }

  /* ===== Доска ===== */
  #board {
    position: fixed; inset: 0;
    overflow: hidden;
    background:
      radial-gradient(circle at 20% 30%, #2a2535 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, #1f2a35 0%, transparent 50%),
      #14141a;
    cursor: grab;
  }
  #board:active { cursor: grabbing; }
  #world {
    position: absolute;
    top: 0; left: 0;
    width: 12000px; height: 12000px;
    transform-origin: 0 0;
  }

  .zone {
    position: absolute;
    border-radius: 32px;
    border: 2px dashed rgba(255,255,255,0.1);
    pointer-events: none;
  }
  .zone-label {
    position: absolute;
    top: -20px; left: 32px;
    background: #252530;
    padding: 8px 22px;
    border-radius: 14px;
    font-size: var(--zone-label);
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: #bbb;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }

  /* ===== Карточка ===== */
  .wish {
    position: absolute;
    border-radius: 18px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    padding: calc(14px * var(--ui-scale));
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: box-shadow 0.15s;
    user-select: none;
    cursor: grab;
  }
  .wish:active { cursor: grabbing; }
  .wish.dragging { box-shadow: 0 14px 40px rgba(0,0,0,0.75); z-index: 9999; }
  .wish.done { opacity: 0.45; }
  .wish.done .wish-text { text-decoration: line-through; }
  .wish.dim { opacity: 0.15; }

  .wish-img {
    width: 100%; flex: 1;
    object-fit: cover;
    border-radius: 10px;
    margin-bottom: 8px;
    pointer-events: none;
    background: rgba(255,255,255,0.1);
    min-height: 0;
  }
  .wish-text {
    font-size: calc(16px * var(--ui-scale));
    font-weight: 600;
    color: #2d2d2d;
    line-height: 1.3;
    word-break: break-word;
    pointer-events: none;
    flex-shrink: 0;
  }
  .wish-badge {
    position: absolute;
    top: 8px; right: 8px;
    font-size: calc(20px * var(--ui-scale));
    pointer-events: none;
  }
  .wish-done-badge {
    position: absolute;
    top: 8px; left: 8px;
    font-size: calc(20px * var(--ui-scale));
    pointer-events: none;
  }
  .wish-deadline {
    position: absolute;
    bottom: 8px; left: 10px;
    font-size: calc(12px * var(--ui-scale));
    font-weight: 700;
    background: rgba(0,0,0,0.55);
    color: white;
    padding: 4px 10px;
    border-radius: 10px;
    pointer-events: none;
  }
  .wish-deadline.soon { background: rgba(220,120,0,0.95); }
  .wish-deadline.overdue { background: rgba(200,50,50,0.95); }

  .wish-progress { margin-top: 6px; pointer-events: none; flex-shrink: 0; }
  .progress-bar {
    height: calc(8px * var(--ui-scale));
    background: rgba(0,0,0,0.15);
    border-radius: 5px; overflow: hidden; margin-bottom: 5px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #8b6bb1, #b18bdb);
    border-radius: 5px;
  }
  .progress-text {
    font-size: calc(12px * var(--ui-scale));
    font-weight: 700; color: #555;
  }

  .wish-handle {
    position: absolute;
    bottom: 0; right: 0;
    width: calc(30px * var(--ui-scale));
    height: calc(30px * var(--ui-scale));
    cursor: nwse-resize;
    display: flex; align-items: center; justify-content: center;
    color: rgba(0,0,0,0.3);
    font-size: calc(18px * var(--ui-scale));
  }

  /* ===== Верхняя панель ===== */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0;
    padding: var(--topbar-padding);
    display: flex; align-items: center; gap: 14px;
    background: rgba(30,30,40,0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    z-index: 50;
    flex-wrap: nowrap;
    overflow: hidden;
  }
  #topbar .title {
    font-size: var(--title-font);
    font-weight: 700;
    color: #eee;
    flex-shrink: 0;
  }
  #search-input {
    flex: 1; min-width: 100px;
    padding: var(--btn-padding);
    border-radius: 12px;
    border: 1px solid #3a3a45;
    background: rgba(26,26,34,0.9);
    color: #eee;
    font-size: var(--btn-font);
    font-family: inherit;
  }
  #search-input:focus { outline: none; border-color: #a78bca; }
  #search-input::placeholder { color: #666; }
  #topbar button {
    padding: var(--btn-padding);
    border-radius: 12px;
    border: none;
    background: #7a5ba0;
    color: white;
    font-size: var(--btn-font);
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
  }
  #topbar .logout-btn {
    background: none; color: #888;
    font-size: calc(13px * var(--ui-scale));
    text-decoration: underline;
    padding: 8px;
    font-weight: 500;
  }

  /* ===== Нижняя панель ===== */
  #bottombar {
    position: fixed;
    bottom: calc(28px * var(--ui-scale));
    left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 10px;
    z-index: 50;
  }
  #bottombar button {
    padding: calc(16px * var(--ui-scale)) calc(28px * var(--ui-scale));
    border-radius: 40px;
    border: none;
    background: #7a5ba0;
    color: white;
    font-size: calc(17px * var(--ui-scale));
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 22px rgba(122,91,160,0.6);
  }

  /* ===== Модалки ===== */
  .modal-bg {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.65);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 200;
  }
  .modal {
    background: #252530; color: #eee; border-radius: 22px;
    padding: var(--modal-padding);
    width: 100%; max-width: var(--modal-max-w);
    max-height: 90vh; overflow-y: auto;
  }
  .modal h2 { font-size: var(--modal-h2); margin: 0 0 20px; color: #fff; font-weight: 700; }
  .modal label { font-size: var(--modal-label); color: #aaa; display: block; margin-top: 16px; margin-bottom: 8px; font-weight: 500; }
  .modal input, .modal textarea, .modal select {
    width: 100%; padding: calc(12px * var(--ui-scale)); border-radius: 12px;
    border: 1px solid #3a3a45; font-size: var(--modal-input); font-family: inherit;
    background: #1a1a22; color: #eee;
  }
  .modal input:focus, .modal textarea:focus { outline: none; border-color: #a78bca; }
  .modal textarea { resize: vertical; min-height: 80px; }
  .modal-row { display: flex; gap: 10px; }
  .modal-row > * { flex: 1; }
  .colors { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
  .color-swatch {
    width: calc(40px * var(--ui-scale));
    height: calc(40px * var(--ui-scale));
    border-radius: 50%;
    cursor: pointer;
    border: 4px solid transparent;
  }
  .color-swatch.active { border-color: #b18bdb; }
  .modal-actions { display: flex; gap: 10px; margin-top: 22px; }
  .modal-actions button {
    flex: 1; padding: var(--modal-btn-padding); border-radius: 12px; border: none;
    font-size: var(--modal-btn-font); font-weight: 700; cursor: pointer;
  }
  .modal-actions .save { background: #7a5ba0; color: white; }
  .modal-actions .cancel { background: #3a3a45; color: #ddd; }
  .modal-actions .delete { background: #5a3030; color: #f99; }
  .hidden { display: none !important; }

  /* ===== Подсказка ===== */
  #hint {
    position: fixed;
    top: calc(80px * var(--ui-scale));
    left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.15); color: white;
    padding: 14px 24px; border-radius: 24px;
    font-size: var(--hint-font);
    z-index: 60; transition: opacity 0.5s; pointer-events: none;
    max-width: 90%; text-align: center;
    backdrop-filter: blur(8px);
  }

  /* ===== Напоминание ===== */
  #reminder {
    position: fixed;
    bottom: calc(100px * var(--ui-scale));
    left: 50%; transform: translateX(-50%);
    background: #252530; color: #eee;
    padding: calc(18px * var(--ui-scale)) calc(22px * var(--ui-scale));
    border-radius: 20px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.7);
    max-width: 90%; width: calc(460px * var(--ui-scale));
    z-index: 70;
    display: flex; gap: 16px; align-items: center;
    border: 1px solid rgba(255,255,255,0.08);
  }
  #reminder .rem-icon { font-size: var(--rem-icon); flex-shrink: 0; }
  #reminder .rem-text { flex: 1; font-size: var(--rem-font); }
  #reminder .rem-text b { display: block; font-size: calc(13px * var(--ui-scale)); color: #888; margin-bottom: 4px; font-weight: 500; }
  #reminder .rem-close {
    background: none; border: none; font-size: calc(20px * var(--ui-scale));
    color: #999; cursor: pointer; padding: 6px; flex-shrink: 0;
  }
</style>
</head>
<body>

  <div id="auth-screen">
    <h1>✨ Мои желания</h1>
    <div class="sub">Войди, чтобы открыть свою доску</div>
    <div class="auth-box">
      <p>Введи email и пароль</p>
      <input id="email" type="email" placeholder="email" autocomplete="username" />
      <input id="password" type="password" placeholder="пароль" autocomplete="current-password" />
      <button id="login-btn" onclick="login()">Войти</button>
      <div id="auth-msg" class="auth-msg"></div>
    </div>
  </div>

  <div id="topbar" class="hidden">
    <div class="title">✨ Мои желания</div>
    <input id="search-input" placeholder="🔍 Поиск..." oninput="applySearch()" />
    <button onclick="openNewWish()">+</button>
    <button class="logout-btn" onclick="logout()">Выйти</button>
  </div>

  <div id="board" class="hidden">
    <div id="world">
      <div id="zones"></div>
    </div>
  </div>

  <div id="bottombar" class="hidden">
    <button onclick="openNewWish()">＋ Добавить желание</button>
  </div>

  <div id="hint" class="hidden">Тащи карточки · Тапни — редактировать · Двойной клик по пустому — сброс вида</div>

<!-- ===== ЧАСТЬ 2 ПРИДЁТ СЛЕДУЮЩИМ СООБЩЕНИЕМ ===== -->

 <script>
  const SUPABASE_URL = 'https://mdlpxazhddmkjzqvyjpp.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_0umpiGCYpJdrK2xru-IrBw_sdzbW3nC';

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentUser = null;
  let wishes = [];
  let editingId = null;
  let selectedColor = '#fff3b0';

  let cam = { x: 0, y: 0, scale: 1 };

  const WORLD_SIZE = 12000;
  const WORLD_CENTER = WORLD_SIZE / 2;

  // Зоны: три большие области
  const ZONES = [
    { id: 'dreams', label: '💭 Мечты',    x: 500,  y: 500, w: 3200, h: 6000, color: 'rgba(255, 120, 120, 0.06)' },
    { id: 'soon',   label: '⭐ Скоро',    x: 4400, y: 500, w: 3200, h: 6000, color: 'rgba(120, 180, 255, 0.06)' },
    { id: 'done',   label: '✅ Сбылось', x: 8300, y: 500, w: 3200, h: 6000, color: 'rgba(120, 255, 160, 0.06)' }
  ];

  const COLORS = [
    '#fff3b0', '#ffd6d6', '#d6e8ff', '#d6ffe0',
    '#ffe8cc', '#e8d6ff', '#ffe0f0', '#e0e0e0'
  ];

  function getDefaultCardSize() {
    const w = window.innerWidth;
    if (w >= 2200) return { w: 440, h: 360 };
    if (w >= 1400) return { w: 380, h: 300 };
    if (w >= 768)  return { w: 320, h: 260 };
    return { w: 240, h: 200 };
  }

  async function checkSession() {
    const { data } = await db.auth.getSession();
    if (data.session) {
      currentUser = data.session.user;
      startApp();
    }
  }

  async function login() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const msg = document.getElementById('auth-msg');

    if (!email || !password) { msg.textContent = 'Введи email и пароль'; return; }

    document.getElementById('login-btn').disabled = true;
    msg.textContent = '';

    const { data, error } = await db.auth.signInWithPassword({ email, password });

    document.getElementById('login-btn').disabled = false;

    if (error) { msg.textContent = 'Неверный email или пароль'; return; }

    currentUser = data.user;
    document.getElementById('password').value = '';
    startApp();
  }

  async function logout() {
    await db.auth.signOut();
    currentUser = null;
    wishes = [];
    document.getElementById('topbar').classList.add('hidden');
    document.getElementById('board').classList.add('hidden');
    document.getElementById('bottombar').classList.add('hidden');
    const rem = document.getElementById('reminder');
    if (rem) rem.remove();
    document.getElementById('auth-screen').classList.remove('hidden');
  }

  function startApp() {
    document.getElementById('auth-screen').classList.add('hidden');
    document.getElementById('topbar').classList.remove('hidden');
    document.getElementById('board').classList.remove('hidden');
    document.getElementById('bottombar').classList.remove('hidden');

    renderZones();
    loadWishes();

    const hint = document.getElementById('hint');
    hint.classList.remove('hidden');
    setTimeout(() => { hint.style.opacity = '0'; }, 5000);
    setTimeout(() => { hint.classList.add('hidden'); }, 5500);
  }

  // Подгоняем вид так, чтобы три зоны были видны
  function fitView() {
    const minX = 200;
    const minY = 300;
    const maxX = 11700;
    const maxY = 6700;
    const zoneW = maxX - minX;
    const zoneH = maxY - minY;

    const screenW = window.innerWidth;
    const screenH = window.innerHeight;

    const scaleX = screenW / zoneW;
    const scaleY = screenH / zoneH;
    const scale = Math.min(scaleX, scaleY) * 0.95;
    cam.scale = Math.max(0.2, Math.min(1.5, scale));

    const centerX = (minX + maxX) / 2;
    const centerY = (minY + maxY) / 2;

    cam.x = screenW / 2 - centerX * cam.scale;
    cam.y = screenH / 2 - centerY * cam.scale;
    applyCamera();
  }

  function renderZones() {
    const wrap = document.getElementById('zones');
    wrap.innerHTML = ZONES.map(z =>
      '<div class="zone" style="left:' + z.x + 'px; top:' + z.y + 'px; width:' + z.w + 'px; height:' + z.h + 'px; background:' + z.color + ';">' +
        '<div class="zone-label">' + z.label + '</div>' +
      '</div>'
    ).join('');
  }

  function getZoneForPos(x, y) {
    for (const z of ZONES) {
      if (x >= z.x && x < z.x + z.w && y >= z.y && y < z.y + z.h) return z.id;
    }
    return null;
  }

  async function loadWishes() {
    const { data, error } = await db
      .from('wishes')
      .select('*')
      .order('created_at', { ascending: true });

    if (error) {
      alert('Ошибка загрузки: ' + error.message);
      return;
    }
    wishes = data || [];
    renderAll();
    fitView();
    maybeShowReminder();
  }

  function renderAll() {
    const world = document.getElementById('world');
    world.querySelectorAll('.wish').forEach(el => el.remove());
    wishes.forEach(w => world.appendChild(createCard(w)));
    applySearch();
  }

  function createCard(w) {
    const el = document.createElement('div');
    el.className = 'wish' + (w.done ? ' done' : '');
    el.dataset.id = w.id;
    el.dataset.text = (w.text || '').toLowerCase();
    el.style.left = w.pos_x + 'px';
    el.style.top = w.pos_y + 'px';
    el.style.width = w.width + 'px';
    el.style.height = w.height + 'px';
    el.style.background = w.color || '#fff3b0';

    const badge = w.importance === 1 ? '🔥' : w.importance === 2 ? '⭐' : '💭';

    let imgHtml = '';
    if (w.image_url) {
      imgHtml = '<img class="wish-img" src="' + escapeAttr(w.image_url) + '" onerror="this.style.display=\'none\'" />';
    }

    let deadlineHtml = '';
    if (w.deadline) {
      const d = new Date(w.deadline);
      const now = new Date();
      const daysLeft = Math.ceil((d - now) / (1000 * 60 * 60 * 24));
      let cls = '';
      let label = '';
      if (w.done) {
        label = '✅ ' + formatDate(d);
      } else if (daysLeft < 0) {
        cls = 'overdue';
        label = '❗ ' + formatDate(d);
      } else if (daysLeft <= 7) {
        cls = 'soon';
        label = '⏰ ' + daysLeft + ' дн';
      } else {
        label = '📅 ' + formatDate(d);
      }
      deadlineHtml = '<div class="wish-deadline ' + cls + '">' + label + '</div>';
    }

    let progressHtml = '';
    if (w.goal_target && w.goal_target > 0) {
      const current = Number(w.goal_current) || 0;
      const target = Number(w.goal_target);
      const pct = Math.min(100, Math.round((current / target) * 100));
      const unit = w.goal_unit || '';
      progressHtml =
        '<div class="wish-progress">' +
          '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
          '<div class="progress-text">' + current + ' / ' + target + ' ' + unit + ' (' + pct + '%)</div>' +
        '</div>';
    }

    el.innerHTML =
      '<span class="wish-badge">' + badge + '</span>' +
      (w.done ? '<span class="wish-done-badge">✅</span>' : '') +
      imgHtml +
      '<div class="wish-text">' + escapeHtml(w.text) + '</div>' +
      progressHtml +
      deadlineHtml +
      '<div class="wish-handle">◢</div>';

    attachDrag(el, w);
    const handle = el.querySelector('.wish-handle');
    attachResize(handle, el, w);

    el.addEventListener('click', (e) => {
      if (el.dataset.dragged === '1') {
        el.dataset.dragged = '0';
        return;
      }
      openEditWish(w.id);
    });

    return el;
  }

  function formatDate(d) {
    const day = String(d.getDate()).padStart(2, '0');
    const month = String(d.getMonth() + 1).padStart(2, '0');
    return day + '.' + month;
  }

  function attachDrag(el, w) {
    let startX, startY, origX, origY, dragging = false, moved = false;

    const onDown = (e) => {
      if (e.target.classList.contains('wish-handle')) return;
      e.stopPropagation();
      const p = point(e);
      startX = p.x; startY = p.y;
      origX = w.pos_x; origY = w.pos_y;
      dragging = true; moved = false;
      el.classList.add('dragging');
      el.dataset.dragged = '0';
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    };

    const onMove = (e) => {
      if (!dragging) return;
      const p = point(e);
      const dx = (p.x - startX) / cam.scale;
      const dy = (p.y - startY) / cam.scale;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
      w.pos_x = origX + dx;
      w.pos_y = origY + dy;
      el.style.left = w.pos_x + 'px';
      el.style.top = w.pos_y + 'px';
    };

    const onUp = async () => {
      if (!dragging) return;
      dragging = false;
      el.classList.remove('dragging');
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);

      if (moved) {
        el.dataset.dragged = '1';
        w.pos_x = Math.round(w.pos_x);
        w.pos_y = Math.round(w.pos_y);

        const zone = getZoneForPos(w.pos_x, w.pos_y);
        const wasDone = w.done;
        let newDone = wasDone;

        if (zone === 'done') newDone = true;
        else if (zone) newDone = false;

        if (newDone !== wasDone) {
          w.done = newDone;
          await db.from('wishes').update({
            done: w.done, pos_x: w.pos_x, pos_y: w.pos_y
          }).eq('id', w.id);
          refreshCard(w);
          return;
        }

        await db.from('wishes').update({
          pos_x: w.pos_x,
          pos_y: w.pos_y
        }).eq('id', w.id);
      }
    };

    el.addEventListener('pointerdown', onDown);
  }

  function attachResize(handle, el, w) {
    if (!handle) return;

    let startX, startY, origW, origH, resizing = false;

    const onDown = (e) => {
      e.stopPropagation();
      e.preventDefault();
      const p = point(e);
      startX = p.x; startY = p.y;
      origW = w.width; origH = w.height;
      resizing = true;
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    };

    const onMove = (e) => {
      if (!resizing) return;
      const p = point(e);
      const dx = (p.x - startX) / cam.scale;
      const dy = (p.y - startY) / cam.scale;
      w.width = Math.max(180, Math.round(origW + dx));
      w.height = Math.max(120, Math.round(origH + dy));
      el.style.width = w.width + 'px';
      el.style.height = w.height + 'px';
    };

    const onUp = async () => {
      if (!resizing) return;
      resizing = false;
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      await db.from('wishes').update({
        width: w.width,
        height: w.height
      }).eq('id', w.id);
    };

    handle.addEventListener('pointerdown', onDown);
  }

  const board = document.getElementById('board');
  const world = document.getElementById('world');

  let panning = false, panStartX, panStartY, camStartX, camStartY;

  board.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.wish')) return;
    panning = true;
    panStartX = e.clientX;
    panStartY = e.clientY;
    camStartX = cam.x;
    camStartY = cam.y;
    document.addEventListener('pointermove', onPanMove);
    document.addEventListener('pointerup', onPanUp);
  });

  function onPanMove(e) {
    if (!panning) return;
    cam.x = camStartX + (e.clientX - panStartX);
    cam.y = camStartY + (e.clientY - panStartY);
    applyCamera();
  }
  function onPanUp() {
    panning = false;
    document.removeEventListener('pointermove', onPanMove);
    document.removeEventListener('pointerup', onPanUp);
  }

  // Двойной клик по пустому месту — сброс вида
  board.addEventListener('dblclick', (e) => {
    if (e.target.closest('.wish')) return;
    fitView();
  });

  function applyCamera() {
    world.style.transform = 'translate(' + cam.x + 'px, ' + cam.y + 'px) scale(' + cam.scale + ')';
  }

  let pinchStartDist = 0, pinchStartScale = 1;

  board.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      pinchStartDist = dist(e.touches[0], e.touches[1]);
      pinchStartScale = cam.scale;
    }
  }, { passive: true });

  board.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2 && pinchStartDist > 0) {
      const d = dist(e.touches[0], e.touches[1]);
      const newScale = Math.min(2.5, Math.max(0.15, pinchStartScale * (d / pinchStartDist)));
      cam.scale = newScale;
      applyCamera();
    }
  }, { passive: true });

  board.addEventListener('touchend', () => { pinchStartDist = 0; });

  board.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = -e.deltaY * 0.001;
    cam.scale = Math.min(2.5, Math.max(0.15, cam.scale * (1 + delta)));
    applyCamera();
  }, { passive: false });

  function dist(a, b) {
    const dx = a.clientX - b.clientX;
    const dy = a.clientY - b.clientY;
    return Math.sqrt(dx*dx + dy*dy);
  }

  function point(e) {
    return { x: e.clientX, y: e.clientY };
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escapeAttr(s) {
    return String(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

// ===== ЧАСТЬ 3 ПРИДЁТ СЛЕДУЮЩИМ СООБЩЕНИЕМ =====

    function openNewWish() {
    editingId = null;
    selectedColor = '#fff3b0';

    const modal = document.createElement('div');
    modal.className = 'modal-bg';
    modal.id = 'modal';
    modal.innerHTML =
      '<div class="modal">' +
        '<h2>Новое желание</h2>' +
        '<label>Что я хочу?</label>' +
        '<textarea id="m-text" placeholder="Например: съездить в Японию"></textarea>' +
        '<label>Ссылка на картинку (необязательно)</label>' +
        '<input id="m-image" placeholder="https://example.com/image.jpg" />' +
        '<label>Важность</label>' +
        '<select id="m-importance">' +
          '<option value="1">🔥 Очень важно</option>' +
          '<option value="2" selected>⭐ Важно</option>' +
          '<option value="3">💭 Просто хочется</option>' +
        '</select>' +
        '<label>Дедлайн (необязательно)</label>' +
        '<input id="m-deadline" type="date" />' +
        '<label>Цель (необязательно)</label>' +
        '<div class="modal-row">' +
          '<input id="m-goal-current" type="number" placeholder="Сейчас" />' +
          '<input id="m-goal-target" type="number" placeholder="Цель" />' +
          '<input id="m-goal-unit" placeholder="₽, кг, шт" />' +
        '</div>' +
        '<label>Цвет</label>' +
        '<div class="colors" id="m-colors"></div>' +
        '<div class="modal-actions">' +
          '<button class="cancel" onclick="closeModal()">Отмена</button>' +
          '<button class="save" onclick="saveNew()">Добавить</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(modal);
    renderColorPicker();
    document.getElementById('m-text').focus();
  }

  function renderColorPicker() {
    const wrap = document.getElementById('m-colors');
    if (!wrap) return;
    wrap.innerHTML = COLORS.map(c =>
      '<div class="color-swatch ' + (c === selectedColor ? 'active' : '') + '" ' +
           'style="background:' + c + '" ' +
           'onclick="pickColor(\'' + c + '\')"></div>'
    ).join('');
  }

  function pickColor(c) {
    selectedColor = c;
    renderColorPicker();
  }

  async function saveNew() {
    const text = document.getElementById('m-text').value.trim();
    if (!text) { alert('Напиши желание'); return; }

    const importance = +document.getElementById('m-importance').value;
    const image_url = document.getElementById('m-image').value.trim() || null;
    const deadline = document.getElementById('m-deadline').value || null;
    const gc = document.getElementById('m-goal-current').value;
    const gt = document.getElementById('m-goal-target').value;
    const gu = document.getElementById('m-goal-unit').value.trim() || null;
    const goal_current = gc !== '' ? Number(gc) : null;
    const goal_target = gt !== '' ? Number(gt) : null;

    const pos_x = Math.round(-cam.x / cam.scale + window.innerWidth / (2 * cam.scale));
    const pos_y = Math.round(-cam.y / cam.scale + window.innerHeight / (2 * cam.scale));

    const size = getDefaultCardSize();

    const { data, error } = await db.from('wishes').insert([{
      text: text,
      importance: importance,
      image_url: image_url,
      deadline: deadline,
      goal_current: goal_current,
      goal_target: goal_target,
      goal_unit: gu,
      color: selectedColor,
      pos_x: pos_x,
      pos_y: pos_y,
      width: size.w,
      height: size.h,
      user_id: currentUser.id
    }]).select();

    if (error) { alert('Ошибка: ' + error.message); return; }

    wishes.push(data[0]);
    document.getElementById('world').appendChild(createCard(data[0]));
    applySearch();
    closeModal();
  }

  function openEditWish(id) {
    const w = wishes.find(x => x.id === id);
    if (!w) return;

    editingId = id;
    selectedColor = w.color || '#fff3b0';

    const modal = document.createElement('div');
    modal.className = 'modal-bg';
    modal.id = 'modal';
    modal.innerHTML =
      '<div class="modal">' +
        '<h2>Редактировать желание</h2>' +
        '<label>Текст</label>' +
        '<textarea id="m-text">' + escapeHtml(w.text) + '</textarea>' +
        '<label>Ссылка на картинку</label>' +
        '<input id="m-image" value="' + escapeAttr(w.image_url || '') + '" placeholder="https://..." />' +
        '<label>Важность</label>' +
        '<select id="m-importance">' +
          '<option value="1" ' + (w.importance===1?'selected':'') + '>🔥 Очень важно</option>' +
          '<option value="2" ' + (w.importance===2?'selected':'') + '>⭐ Важно</option>' +
          '<option value="3" ' + (w.importance===3?'selected':'') + '>💭 Просто хочется</option>' +
        '</select>' +
        '<label>Дедлайн</label>' +
        '<input id="m-deadline" type="date" value="' + (w.deadline || '') + '" />' +
        '<label>Цель</label>' +
        '<div class="modal-row">' +
          '<input id="m-goal-current" type="number" placeholder="Сейчас" value="' + (w.goal_current != null ? w.goal_current : '') + '" />' +
          '<input id="m-goal-target" type="number" placeholder="Цель" value="' + (w.goal_target != null ? w.goal_target : '') + '" />' +
          '<input id="m-goal-unit" placeholder="₽, кг" value="' + escapeAttr(w.goal_unit || '') + '" />' +
        '</div>' +
        '<label>Цвет</label>' +
        '<div class="colors" id="m-colors"></div>' +
        '<div class="modal-actions">' +
          '<button class="delete" onclick="deleteWish()">Удалить</button>' +
          '<button class="cancel" onclick="closeModal()">Отмена</button>' +
          '<button class="save" onclick="saveEdit()">Сохранить</button>' +
        '</div>' +
        '<div class="modal-actions" style="margin-top:10px;">' +
          '<button class="cancel" onclick="toggleDone()" style="background:#2a4a2a;color:#8f8;">' +
            (w.done ? '↩ Вернуть в работу' : '✅ Отметить сбывшимся') +
          '</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(modal);
    renderColorPicker();
  }

  async function saveEdit() {
    const w = wishes.find(x => x.id === editingId);
    if (!w) return;

    const text = document.getElementById('m-text').value.trim();
    if (!text) { alert('Текст не может быть пустым'); return; }

    const importance = +document.getElementById('m-importance').value;
    const image_url = document.getElementById('m-image').value.trim() || null;
    const deadline = document.getElementById('m-deadline').value || null;
    const gc = document.getElementById('m-goal-current').value;
    const gt = document.getElementById('m-goal-target').value;
    const gu = document.getElementById('m-goal-unit').value.trim() || null;
    const goal_current = gc !== '' ? Number(gc) : null;
    const goal_target = gt !== '' ? Number(gt) : null;

    const { error } = await db.from('wishes').update({
      text: text,
      importance: importance,
      image_url: image_url,
      deadline: deadline,
      goal_current: goal_current,
      goal_target: goal_target,
      goal_unit: gu,
      color: selectedColor
    }).eq('id', w.id);

    if (error) { alert('Ошибка: ' + error.message); return; }

    w.text = text;
    w.importance = importance;
    w.image_url = image_url;
    w.deadline = deadline;
    w.goal_current = goal_current;
    w.goal_target = goal_target;
    w.goal_unit = gu;
    w.color = selectedColor;

    refreshCard(w);
    applySearch();
    closeModal();
  }

  async function deleteWish() {
    const w = wishes.find(x => x.id === editingId);
    if (!w) return;
    if (!confirm('Удалить это желание?')) return;

    const { error } = await db.from('wishes').delete().eq('id', w.id);
    if (error) { alert('Ошибка: ' + error.message); return; }

    wishes = wishes.filter(x => x.id !== w.id);
    const el = document.querySelector('.wish[data-id="' + w.id + '"]');
    if (el) el.remove();
    closeModal();
  }

  async function toggleDone() {
    const w = wishes.find(x => x.id === editingId);
    if (!w) return;

    const { error } = await db.from('wishes').update({ done: !w.done }).eq('id', w.id);
    if (error) { alert('Ошибка: ' + error.message); return; }

    w.done = !w.done;
    refreshCard(w);
    applySearch();
    closeModal();
  }

  function refreshCard(w) {
    const old = document.querySelector('.wish[data-id="' + w.id + '"]');
    if (!old) return;
    const fresh = createCard(w);
    old.replaceWith(fresh);
  }

  function closeModal() {
    const m = document.getElementById('modal');
    if (m) m.remove();
    editingId = null;
  }

  function applySearch() {
    const q = (document.getElementById('search-input').value || '').trim().toLowerCase();
    const cards = document.querySelectorAll('.wish');
    cards.forEach(card => {
      if (!q) {
        card.classList.remove('dim');
      } else {
        const t = card.dataset.text || '';
        if (t.includes(q)) card.classList.remove('dim');
        else card.classList.add('dim');
      }
    });
  }

  function maybeShowReminder() {
    const old = document.getElementById('reminder');
    if (old) old.remove();

    const dreams = wishes.filter(w => !w.done && w.importance === 1);
    if (dreams.length === 0) return;

    const w = dreams[Math.floor(Math.random() * dreams.length)];

    const rem = document.createElement('div');
    rem.id = 'reminder';
    rem.innerHTML =
      '<div class="rem-icon">✨</div>' +
      '<div class="rem-text">' +
        '<b>Твоя важная мечта:</b>' +
        escapeHtml(w.text) +
      '</div>' +
      '<button class="rem-close" onclick="this.parentElement.remove()">✕</button>';
    document.body.appendChild(rem);

    setTimeout(() => {
      const r = document.getElementById('reminder');
      if (r) r.remove();
    }, 15000);
  }

  // Горячая клавиша: "F" — сброс вида (если не в модалке)
  document.addEventListener('keydown', (e) => {
    if (e.key === 'f' || e.key === 'F' || e.key === 'а' || e.key === 'А') {
      if (document.getElementById('modal')) return;
      if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) return;
      fitView();
    }
  });

  document.getElementById('password').addEventListener('keypress', e => {
    if (e.key === 'Enter') login();
  });

  checkSession();
</script>
